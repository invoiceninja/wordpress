# Local + CI test stack. Run from the repo root:
#   docker compose -f dev/docker-compose.yml up -d
#   python3 tests/flows/run.py
#
# WP_IMAGE_TAG picks the PHP version (e.g. php8.1-apache, php8.4-apache).
# WP_VERSION optionally pins the WordPress version (installed by tests/flows/run.py).

name: invoiceninja-dev

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 40

  wordpress:
    image: wordpress:${WP_IMAGE_TAG:-php8.3-apache}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8089}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISABLE_WP_CRON', true );
    volumes:
      - wordpress:/var/www/html
      - ..:/var/www/html/wp-content/plugins/invoiceninja
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins

  cli:
    image: wordpress:cli-${WP_CLI_PHP:-php8.3}
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress:/var/www/html
      - ..:/var/www/html/wp-content/plugins/invoiceninja
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
    entrypoint: ["wp"]
    command: ["--info"]

  composer:
    image: composer:2
    working_dir: /app
    volumes:
      - ..:/app
    entrypoint: ["composer"]

  php:
    image: composer:2
    working_dir: /app
    volumes:
      - ..:/app
    entrypoint: ["php"]

volumes:
  wordpress:
