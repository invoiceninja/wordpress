# Routes by hostname. Upstreams are resolved per request (Docker DNS), so the proxy starts even
# when the Invoice Ninja profile isn't running.
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Port 8089;
proxy_read_timeout 300s;
client_max_body_size 64m;
server_tokens off;

server {
    listen 8089 default_server;
    server_name localhost wp.localhost;

    location = /proxy-health { access_log off; return 200 "ok\n"; }

    location / {
        set $wordpress http://wordpress:80;
        proxy_pass $wordpress;
    }
}

server {
    listen 8089;
    server_name in.localhost;

    location / {
        set $invoiceninja http://in-web:80;
        proxy_pass $invoiceninja;
    }
}
