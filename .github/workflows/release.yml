name: Release Plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Install Composer dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: Zip project
      # The zip contains a top-level invoiceninja/ folder, so installs work even if the zip is renamed (#2)
      run: |
        mkdir -p build/invoiceninja
        rsync -a --exclude-from=.distignore ./ build/invoiceninja/
        (cd build && zip -rq ../invoiceninja.zip invoiceninja)
        unzip -l invoiceninja.zip | tail -1

    - name: Upload app archive to workflow
      uses: actions/upload-artifact@v4
      with:
        name: InvoiceNinja
        path: invoiceninja.zip

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: marvinpinto/action-automatic-releases@v1.2.1
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        draft: false
        prerelease: false
        title: "Latest Release"
        automatic_release_tag: "v1.0.16"
        files: |
            ${{ github.workspace }}/artifacts/InvoiceNinja

