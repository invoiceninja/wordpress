name: CI

on:
  push:
    branches: [main, 1.x]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # nightly: catches breakage from new WordPress/PHP releases

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint every PHP file
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l -d display_errors=1 -d error_reporting=-1 > lint.log 2>&1 || { cat lint.log; exit 1; }
          if grep -E "Deprecated|Warning|Parse error|Fatal" lint.log; then exit 1; fi

  guard:
    name: Version guard parses on old PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: none
      # The main file must explain "needs PHP 8.1" instead of crashing on old PHP
      - run: php -l invoiceninja.php && php -l uninstall.php

  static:
    name: PHPStan and coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr
      - uses: ramsey/composer-install@v3
      - name: PHPStan (level 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github
      - name: PHPCS (WordPress coding standards, PHP compatibility)
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        include:
          - php: '8.5'
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite unit

  e2e:
    name: E2E ${{ matrix.shard }} (${{ matrix.image }}${{ matrix.wp && format(', WP {0}', matrix.wp) || ', latest WP' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The flows share one WordPress per job, so they're split into shards that run as parallel jobs.
      matrix:
        image: [php8.1-apache, php8.3-apache, php8.4-apache]
        wp: ['']  # Latest; the WP 6.7 entries below are extra jobs.
        shard: [core, modules]
        include:
          - shard: core
            suites: v1,v2
          - shard: modules
            suites: portal,forms,subscriptions,webhooks
          - image: php8.1-apache
            wp: '6.7'
            shard: core
            suites: v1,v2
          - image: php8.1-apache
            wp: '6.7'
            shard: modules
            suites: portal,forms,subscriptions,webhooks
          - image: php8.3-apache
            shard: woocommerce
            suites: woocommerce
            woocommerce: '11.2.1'
    env:
      WP_IMAGE_TAG: ${{ matrix.image }}
      WP_VERSION: ${{ matrix.wp }}
      WOOCOMMERCE_VERSION: ${{ matrix.woocommerce }}  # tests/flows/run.py installs it after WordPress
      COMPOSE: docker compose -f dev/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Build the autoloader (no dev dependencies, like the release zip)
        run: composer install --no-dev --optimize-autoloader --no-interaction
      - name: Start WordPress + mocked Invoice Ninja
        run: |
          $COMPOSE pull --quiet
          $COMPOSE up -d --wait
      - name: Run end-to-end flows
        run: python3 tests/flows/run.py suite:${{ matrix.suites }}
      - name: Show logs on failure
        if: failure()
        run: |
          $COMPOSE exec -T wordpress sh -c 'cat /var/www/html/wp-content/debug.log 2>/dev/null | tail -100' || true
          $COMPOSE exec -T wordpress sh -c 'tail -50 /var/www/html/wp-content/in-mock-requests.log' || true
          $COMPOSE logs --tail=100 wordpress || true
      - name: Stop stack
        if: always()
        run: $COMPOSE down -v

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    # Reports WP.org review issues. Not blocking until the 2.0 codebase replaces 1.x.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-dev --optimize-autoloader --no-interaction
      - name: Build the plugin directory as it is released
        run: |
          mkdir -p build/invoiceninja
          rsync -a --exclude-from=.distignore ./ build/invoiceninja/
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/invoiceninja
          # While 2.0 is in alpha, readme.txt keeps Stable tag: 1.0.16 so WordPress.org keeps serving 1.0.16.
          ignore-codes: stable_tag_mismatch
