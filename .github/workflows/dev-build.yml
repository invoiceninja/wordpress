name: Dev build

# Every push to 2.0-dev builds the plugin zip and replaces the "dev-build" pre-release, so the
# latest development version is always at one link:
#   https://github.com/invoiceninja/wordpress/releases/download/dev-build/invoiceninja.zip
# The tag doesn't start with "v", so it never triggers release.yml or reaches WordPress.org.

on:
  push:
    branches: ['2.0-dev']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build the plugin folder and zip
        # Same layout as release.yml: a top-level invoiceninja/ folder inside the zip.
        run: |
          mkdir -p build/invoiceninja
          rsync -a --exclude-from=.distignore ./ build/invoiceninja/
          (cd build && zip -rq ../invoiceninja.zip invoiceninja)
          unzip -l invoiceninja.zip | tail -1

      - name: Replace the dev-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ \* Version: *//p' invoiceninja.php | tr -d '[:space:]')
          short=$(git rev-parse --short HEAD)
          notes="Development build of ${version} from ${GITHUB_REF_NAME} at ${short}, built $(date -u '+%Y-%m-%d %H:%M UTC').

          Not for live sites: it's untested, and updates aren't offered automatically. Install it on a test or staging site from Plugins → Add New → Upload Plugin. Requires WordPress 6.7 and PHP 8.1.

          Stable releases: https://wordpress.org/plugins/invoiceninja/"
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build invoiceninja.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Development build (${version}, ${short})" \
            --notes "$notes"
